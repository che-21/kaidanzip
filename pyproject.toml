[project]
name = "md2short"
version = "1.0.0"
description = "연출표 마크다운 + 장면 이미지 → 9:16 숏폼 MP4 (ElevenLabs + Remotion)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "mutagen>=1.47",
    "streamlit>=1.40",
]

[project.scripts]
md2short = "md2short.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["md2short"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "node: requires Node.js + remotion/node_modules (real Remotion render)",
]
